name: Go Backend CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build, Format, and Test
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout your code from the GitHub repository into the virtual runner environment
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup the Go compiler environment matching your development workspace version
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true # Automatically handles caching for go.mod dependencies to accelerate runs

    # 3. Verify that all imports match and code complies with style guidelines
    - name: Check Formatting
      run: |
        if [ -n "$(go fmt ./...)" ]; then
          echo "Error: Code is not properly formatted. Run 'go fmt ./...' locally and commit changes."
          exit 1
        fi

    # 4. Pull dependencies down to ensure the build matrix handles external changes smoothly
    - name: Install Dependencies
      run: go mod download

    # 5. Execute your complete internal unit test suite with Go's strict race detector active
    - name: Run Unit Tests with Race Detector
      run: go test -v -race -short ./internal/...
